<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Creator Dashboard</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/series.css}">
</head>
<body>

<header class="top-bar">
    <div class="logo">Webtoon Creator</div>
    <div class="top-icons">
        <a th:href="@{/series/creator/profile}" title="Profile">👤</a>
        <a th:href="@{/series/creator/creator_notification}" title="Notifications">🔔</a>
    </div>
</header>

<main class="dashboard-container">
    <h1>Welcome, Creator!</h1>
    <h2>Your Webtoons</h2>

    <div class="series-list">

        <!-- Empty list message -->
        <div th:if="${#lists.isEmpty(seriesList)}" class="empty-list">
            <p>You have not created any comics yet. Use "+ Add Comic" below to start!</p>
        </div>

        <!-- Loop over series -->
        <div th:each="series : ${seriesList}" class="series-card">
            <img th:src="@{${series.coverImage}}" alt="Cover Image" class="series-cover">
<!--            <img th:src="${series.coverImage}" alt="Cover Image" class="series-cover">-->
            <div class="series-info">
                <h3 th:text="${series.title}"></h3>
                <p th:text="${series.description}"></p>
                <p th:text="'Genre: ' + ${series.genre}"></p>
                <div class="action-buttons">
                    <a th:href="@{'/series/edit/' + ${series.id}}" class="btn edit-btn">Edit Comic</a>
                    <a th:href="@{'/series/addEpisode/' + ${series.id}}" class="btn add-episode-btn">Add Episode</a>

                    <form th:action="@{'/series/delete/' + ${series.id}}" method="post" style="display:inline">
                        <button type="submit" class="btn delete-btn"
                                onclick="return confirm('Are you sure you want to delete this comic?')">
                            Delete Comic
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Add new series form -->
    <h2>Add New Comic</h2>
    <form th:action="@{/series/new}" method="post" enctype="multipart/form-data" class="new-comic-form">
        <input type="text" name="title" placeholder="Title" required>
        <textarea name="description" placeholder="Description" required></textarea>
        <input type="text" name="genre" placeholder="Genre" required>
        <input type="file" name="coverImage" accept="image/*" required>
        <button type="submit" class="create-btn">+ Add Comic</button>
    </form>
</main>

<footer>
    <p>© 2026 Webtoon Platform. <a href="#">About</a> | <a href="#">Contact</a> | <a href="#">Help</a></p>
</footer>

</body>
</html>
