<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Episodes</title>
    <link rel="stylesheet" th:href="@{/css/pagestyles.css}">
    <link rel="stylesheet" th:href="@{/css/reader.css}">
</head>
<body>

<h1>Episodes</h1>

<!-- Add new episode form -->
<h2>Add Episode</h2>
<form th:action="@{'/series/addEpisode/' + ${seriesId}}" method="post">
    <input type="text" name="title" placeholder="Episode Title" required>
    <input type="number" name="episodeNumber" placeholder="Episode Number" required>
    <textarea name="episodeText" placeholder="Episode Content" rows="6" required></textarea>
    <button type="submit">Add Episode</button>
</form>

<hr>

<!-- List of existing episodes -->
<h2>Episode List</h2>
<div th:each="episode : ${episodes}">
    <p>
        Episode <span th:text="${episode.episodeNumber}"></span> :
        <span th:text="${episode.title}"></span>
    </p>

    <!-- Episode Actions -->
    <a th:href="@{'/series/editEpisode/' + ${episode.id}}">Edit Episode</a> |
    <a th:href="@{'/series/deleteEpisode/' + ${episode.id}}"
       th:onclick="return confirm('Are you sure you want to delete this episode?');">Delete Episode</a> |
    <a th:href="@{'/series/uploadPanels/' + ${episode.id}}">Upload Panels</a> |
    <a th:href="@{'/reader/readEpisode/' + ${episode.id}}">Read</a>

    <!-- Panels List -->
    <th:block th:if="${episode.panels != null and episode.panels.size() > 0}">
        <h4>Panels</h4>
        <div th:each="panel : ${episode.panels}">

            <span th:text="${panel.panelText != null} ? ${panel.panelOrder} + ': ' + ${#strings.abbreviate(panel.panelText, 30)} : ${panel.panelOrder} + ': No Text'"></span>


            <a th:href="@{'/series/editPanel/' + ${panel.id}}">Edit Panel</a> |
            <a th:href="@{'/series/deletePanel/' + ${panel.id}}"
               th:onclick="return confirm('Are you sure you want to delete this panel?');">Delete Panel</a>
        </div>
    </th:block>

    <hr>
</div>

<br>

<a th:href="@{/reader/back(seriesId=${seriesId})}" class="back-link">← Back</a>

<script>
    function toggleText(id) {
        const preview = document.getElementById('preview-' + id);
        const full = document.getElementById('full-' + id);
        const link = event.target;

        if (full.style.display === 'none') {
            preview.style.display = 'none';
            full.style.display = 'inline';
            link.textContent = 'Show Less';
        } else {
            preview.style.display = 'inline';
            full.style.display = 'none';
            link.textContent = 'Read More';
        }
    }
</script>

</body>
</html>
