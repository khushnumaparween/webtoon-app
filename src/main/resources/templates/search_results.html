<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* Grid layout */
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Card */
        .comic-card {
            background-color: #1c1c1c;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Hover effect */
        .comic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        /* Image */
        .comic-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Title */
        .comic-card h3 {
            margin: 10px 0 5px;
            font-size: 16px;
        }

        /* Author */
        .comic-card p {
            font-size: 14px;
            color: #bbb;
        }

        /* Button */
        .comic-card button {
            margin-top: 8px;
            padding: 6px 12px;
            border: none;
            background-color: #ff4d4d;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .comic-card button:hover {
            background-color: #ff1a1a;
        }

    </style>
</head>
<body>

<h2>Results for "<span th:text="${query}"></span>"</h2>

<div th:if="${#lists.isEmpty(results)}">
    <p>No results found</p>
</div>

<div class="results-container">
    <div th:each="comic : ${results}" class="comic-card">


    <!-- Cover Image -->
    <img th:src="@{${comic.coverImage}}" alt="cover" width="150"/>

    <!-- Title -->
    <h3 th:text="${comic.title}"></h3>

    <!-- Author -->
    <p th:text="${comic.creator.username}"></p>

    <!-- Read Button -->
    <a th:href="@{'/series/' + ${comic.id}}">
        <button>Read</button>
    </a>

</div>
</div>
</div>

</body>
</html>
